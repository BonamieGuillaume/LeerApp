name: Publiceer Leeratelier

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Project ophalen
        uses: actions/checkout@v6
      - name: pnpm installeren
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Node instellen
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - name: Afhankelijkheden installeren
        run: pnpm install --frozen-lockfile
      - name: Inhoud en werking controleren
        run: pnpm check
      - name: Website en iPhone-app bouwen
        run: pnpm build
        env:
          VITE_BASE_PATH: /LeerApp/
      - name: Publicatiebestanden controleren
        run: pnpm check:pwa
        env:
          VITE_BASE_PATH: /LeerApp/
      - name: GitHub Pages instellen
        uses: actions/configure-pages@v5
      - name: Website klaarzetten
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Website publiceren
        id: deployment
        uses: actions/deploy-pages@v4
